[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighter-testing"
version = "0.1.0"
description = "Lighter testnet experiments (Python) — agentic delivery pipeline practice repo"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "lighter-sdk>=1.1", "websockets>=15", "cryptography>=42", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# Pipeline glue (scripts/) is human-owned infrastructure with its own compact
# style — lint targets application code only.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
