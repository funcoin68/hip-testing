[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hip-testing"
version = "0.1.0"
description = "Hyperliquid HIP testnet experiments (Python) — agentic delivery pipeline practice repo"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# Pipeline glue (scripts/) is human-owned infrastructure with its own compact
# style — lint targets application code only.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
