# Supabase local/linked project config — trimmed to what this repo uses.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
# No secrets here — the project ref comes from `supabase link` (gitignored
# state), access tokens come from environment/GitHub secrets (see SETUP.md).
project_id = "hip-testing"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = true
deno_version = 2

# Hello-world scope: the AC requires an unauthenticated curl to return 200.
[functions.hello-world]
verify_jwt = false
