# .github/workflows/supabase-deploy-staging.yml — staging Supabase deploy
# Added 2026-11-26. Applies supabase/migrations/ and deploys edge functions to
# the STAGING project on every merge to main that touches supabase/. This is
# the staging counterpart of stage9b-deploy-prod.yml (which covers PROD, also
# dormant). Stage 8b only deploys functions in Vercel mode — it never pushes
# migrations, which is the gap this workflow closes.
#
# Dormant until var SUPABASE_STAGING_REF is set; with it set, missing secrets
# fail loudly in Preconditions instead of half-deploying.
#
# DB passwords are PER PROJECT: staging uses SUPABASE_STAGING_DB_PASSWORD,
# stage9b prod keeps SUPABASE_DB_PASSWORD. Do not reuse one password for both.
name: supabase-deploy-staging
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy-staging.yml'
  workflow_dispatch: {} # manual re-deploy of current main

permissions:
  contents: read

concurrency:
  group: supabase-deploy-staging
  cancel-in-progress: false # never cancel a half-finished DB migration run

jobs:
  deploy:
    name: Staging — migrations + edge functions
    # Dormant until a staging Supabase project is wired up (var set).
    if: ${{ vars.SUPABASE_STAGING_REF != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Preconditions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN (secret)")
          [ -z "${SUPABASE_STAGING_DB_PASSWORD:-}" ] && missing+=("SUPABASE_STAGING_DB_PASSWORD (secret — STAGING project's database password)")
          [ -z "${SUPABASE_STAGING_REF:-}" ] && missing+=("SUPABASE_STAGING_REF (repo variable — STAGING project ref)")
          [ -z "${STAGING_SUPABASE_URL:-}" ] && missing+=("STAGING_SUPABASE_URL (secret — https://<ref>.supabase.co)")
          [ -z "${STAGING_SUPABASE_ANON_KEY:-}" ] && missing+=("STAGING_SUPABASE_ANON_KEY (secret — STAGING anon/public key)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing configuration: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
        run: npx --yes supabase@${{ vars.SUPABASE_CLI_VERSION || 'latest' }} link --project-ref "$SUPABASE_STAGING_REF"

      - name: Push DB migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
        # --remote=<ref> is REQUIRED: db push defaults to the local Docker stack
        # even when a project is linked (bug #38, stage9b). --yes = headless; the
        # STAGING db password is supplied explicitly.
        run: npx --yes supabase@${{ vars.SUPABASE_CLI_VERSION || 'latest' }} db push --remote="$SUPABASE_STAGING_REF" --password "$SUPABASE_STAGING_DB_PASSWORD" --yes

      - name: Deploy edge functions to staging (if any)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
        # --remote=<ref> must use the '=' form (bug #30); --yes for headless (bug #29)
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            npx --yes supabase@${{ vars.SUPABASE_CLI_VERSION || 'latest' }} functions deploy --remote="$SUPABASE_STAGING_REF" --yes
          else
            echo "no edge functions — skipping"
          fi

  smoke:
    name: Post-deploy smoke (staging)
    needs: deploy
    # Runs only when a staging deploy actually happened (job dormant -> skip).
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: hello-world edge function returns 200
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          code=$(curl -s -o /tmp/fn.json -w "%{http_code}" "$STAGING_SUPABASE_URL/functions/v1/hello-world")
          [ "$code" = "200" ] || { echo "::error::hello-world returned $code"; cat /tmp/fn.json; exit 1; }
          grep -q '"status":"ok"' /tmp/fn.json || { echo "::error::unexpected body:"; cat /tmp/fn.json; exit 1; }
          echo "hello-world OK"

      - name: Migrated tables reachable + anon RLS holds
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          # Table exists + anon SELECT allowed -> 200 (empty table still 200).
          code=$(curl -s -o /tmp/read.json -w "%{http_code}" \
            "$STAGING_SUPABASE_URL/rest/v1/kalshi_events?select=*&limit=1" \
            -H "apikey: $STAGING_SUPABASE_ANON_KEY" -H "Authorization: Bearer $STAGING_SUPABASE_ANON_KEY")
          [ "$code" = "200" ] || { echo "::error::kalshi_events SELECT returned $code — migration missing?"; cat /tmp/read.json; exit 1; }
          echo "kalshi_events reachable via Data API"
          # No insert policy -> anon INSERT must be rejected.
          code=$(curl -s -o /tmp/write.json -w "%{http_code}" -X POST \
            "$STAGING_SUPABASE_URL/rest/v1/kalshi_events" \
            -H "apikey: $STAGING_SUPABASE_ANON_KEY" -H "Authorization: Bearer $STAGING_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"event_ticker":"SMOKE","title":"smoke","away_team":"A","home_team":"B"}')
          case "$code" in
            401|403) echo "anon INSERT rejected with $code (expected — RLS holds)" ;;
            *) echo "::error::anon INSERT returned $code — RLS is OPEN on staging"; cat /tmp/write.json; exit 1 ;;
          esac
