# repo-registry.yaml — Lighter testnet project (single repo, feature-flag everything)
# Consumed by: orchestrator (stage 1), context loader (stage 2), CI risk router (6/9)
version: 1

defaults:
  pack_path: docs/agent/onboarding-pack.md
  rules_path: CLAUDE.md
  feedback_path: docs/agent/CORRECTIONS.md
  staleness_days: 14

services:
  lighter-testing:
    repos: [lighter-testing]          # funcoin68/lighter-testing
    tier: 3                        # practice repo: eligible for future auto-merge after metrics
    owners: ["funcoin68"]

cross_repo_tickets:
  component_map:
    onchain: [lighter-testing]         # Lighter testnet interaction: reads, transactions, builder/agent ops
    wallet: [lighter-testing]          # testnet key management, signing (fake money only)
    pipeline: [lighter-testing]          # scripts/ + .github/workflows/ agentic delivery infra (human-owned)
